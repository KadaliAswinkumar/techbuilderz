<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #0a0a0a;
        color: #f5f1ea;
        font-family: Impact, "Arial Black", sans-serif;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        width: 440px;
        height: 440px;
        border-radius: 50%;
        background: #ff5b1a;
        opacity: 0.12;
        top: -80px;
        right: 80px;
      }
      .glow2 {
        position: absolute;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: #f5f1ea;
        opacity: 0.04;
        bottom: -200px;
        left: -120px;
      }
      .wrap { position: relative; z-index: 1; padding: 72px 80px; }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border: 3px solid #ff5b1a;
        font-size: 22px;
        margin-bottom: 28px;
      }
      .brand { font-size: 48px; letter-spacing: 2px; margin-bottom: 8px; }
      .brand span { color: #ff5b1a; font-family: Georgia, serif; font-style: italic; font-weight: 400; }
      h1 {
        font-size: 64px;
        line-height: 1.05;
        letter-spacing: 1px;
        margin-top: 28px;
        max-width: 900px;
      }
      p {
        margin-top: 24px;
        font-family: Georgia, serif;
        font-style: italic;
        font-size: 28px;
        color: #8a857d;
        max-width: 820px;
      }
      .url {
        position: absolute;
        left: 80px;
        bottom: 64px;
        color: #ff5b1a;
        font-family: Arial, sans-serif;
        font-size: 24px;
        letter-spacing: 6px;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="wrap">
      <div class="mark">TB</div>
      <div class="brand">TECH <span>builderz.</span></div>
      <h1>BEYOND THE INTERFACE.</h1>
      <p>Crafting tomorrow — 3D, motion, product engineering</p>
    </div>
    <div class="url">TECHBUILDERZ.IN</div>
  </body>
</html>
